<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>SPIKE Prime PC Klavye Kontrolü</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #222; color: #fff; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #008CBA; color: white; border: none; border-radius: 5px; }
        .status { margin-top: 20px; font-size: 20px; font-weight: bold; }
        .controls-info { margin-top: 30px; display: inline-block; text-align: left; background: #333; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>F1 SPIKE Prime PC Klavye Kontrol Paneli</h1>
    <button id="connectBtn">1. SPIKE Hub'a Bağlan (Bluetooth)</button>
    
    <div class="status" id="statusText">Durum: Bağlantı Yok</div>

    <div class="controls-info">
        <h3>Klavye Kontrolleri:</h3>
        <ul>
            <li><b>W / Yukarı Ok:</b> İleri Gaz</li>
            <li><b>S / Aşağı Ok:</b> Geri Git</li>
            <li><b>A / Sol Ok:</b> Sola Dön</li>
            <li><b>D / Sağ Ok:</b> Sağa Dön</li>
            <li><b>Space (Boşluk):</b> Fren / Dur</li>
        </ul>
        <p><b>Anlık Gönderilen Veri:</b> <span id="telemetry">Gaz: 0 | Direksiyon: 0</span></p>
    </div>

<script>
let throttle = 0;
let steering = 0;
let keyState = {};

const statusText = document.getElementById('statusText');
const telemetry = document.getElementById('telemetry');

// Klavye Basılma Olayı (KeyDown)
window.addEventListener('keydown', (e) => {
    keyState[e.code] = true;
    updateControlValues();
});

// Klavye Bırakılma Olayı (KeyUp)
window.addEventListener('keyup', (e) => {
    keyState[e.code] = false;
    updateControlValues();
});

function updateControlValues() {
    // Gaz Hesaplama
    if (keyState['KeyW'] || keyState['ArrowUp']) {
        throttle = 80; // İleri hız
    } else if (keyState['KeyS'] || keyState['ArrowDown']) {
        throttle = -60; // Geri hız
    } else {
        throttle = 0;
    }

    // Direksiyon Hesaplama
    if (keyState['KeyA'] || keyState['ArrowLeft']) {
        steering = -100; // Tam Sol
    } else if (keyState['KeyD'] || keyState['ArrowRight']) {
        steering = 100; // Tam Sağ
    } else {
        steering = 0;
    }

    // Acil Fren (Space)
    if (keyState['Space']) {
        throttle = 0;
        steering = 0;
    }

    telemetry.innerText = `Gaz: ${throttle} | Direksiyon: ${steering}`;
    
    // Bluetooth Uyumlu Köprü Fonksiyonuna Gönder
    sendDataToSpike(throttle, steering);
}

function sendDataToSpike(t, s) {
    // Bluetooth veri paketiniz burada SPIKE Hub'a REPL veya LWP3 komutu olarak iletilir.
    // Örn: BluetoothCharacteristic.writeValue(new TextEncoder().encode(`drive_car(${t}, ${s})\r`));
}

document.getElementById('connectBtn').addEventListener('click', async () => {
    statusText.innerText = "Durum: Bağlanıyor...";
    // Web Bluetooth Bağlantı Mantığı...
});
</script>
</body>
</html>
