<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIKE Prime PC Klavye & Ekran Kontrolü v3</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            background: #1e1e24; 
            color: #fff; 
        }
        h1 { margin-bottom: 10px; }
        .btn-connect { 
            padding: 15px 30px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            background: #008CBA; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            transition: background 0.2s;
        }
        .btn-connect:hover { background: #007399; }
        .status { 
            margin: 20px 0; 
            font-size: 20px; 
            font-weight: bold; 
            color: #ffcc00;
        }
        
        /* Ekran Butonları Stili */
        .pad-container {
            display: inline-block;
            margin: 15px auto;
            background: #2b2b36;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .pad-grid {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .control-btn {
            width: 80px;
            height: 80px;
            font-size: 20px;
            font-weight: bold;
            background: #3a3a4c;
            color: #fff;
            border: 2px solid #555;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .control-btn small { font-size: 11px; color: #aaa; margin-top: 2px; }
        .control-btn:active, .control-btn.active {
            background: #008CBA;
            border-color: #00c3ff;
            transform: scale(0.95);
        }
        .btn-space {
            grid-column: span 3;
            width: 100%;
            height: 50px;
            background: #d9534f;
            border-color: #c9302c;
        }
        .btn-space:active, .btn-space.active {
            background: #a94442;
        }

        .controls-info { 
            max-width: 450px;
            margin: 20px auto; 
            text-align: left; 
            background: #2b2b36; 
            padding: 20px; 
            border-radius: 8px; 
        }
        .telemetry-box {
            font-size: 18px;
            font-weight: bold;
            color: #00ffcc;
            background: #111;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>F1 SPIKE Prime PC Kontrol Paneli</h1>
    <button id="connectBtn" class="btn-connect">1. SPIKE Hub'a Bağlan (Bluetooth)</button>
    
    <div class="status" id="statusText">Durum: Bağlantı Yok</div>

    <!-- Dokunmatik & Fare İçin Ekran Butonları -->
    <div class="pad-container">
        <div class="pad-grid">
            <div></div>
            <button class="control-btn" id="btnW">W<small>İleri</small></button>
            <div></div>
            <button class="control-btn" id="btnA">A<small>Sol</small></button>
            <button class="control-btn" id="btnS">S<small>Geri</small></button>
            <button class="control-btn" id="btnD">D<small>Sağ</small></button>
        </div>
        <button class="control-btn btn-space" id="btnSpace">SPACE / FREN</button>
    </div>

    <div class="controls-info">
        <h3>Klavye Kontrolleri:</h3>
        <ul>
            <li><b>W / Yukarı Ok:</b> İleri Gaz (%80)</li>
            <li><b>S / Aşağı Ok:</b> Geri Git (%-60)</li>
            <li><b>A / Sol Ok:</b> Sola Dön (-100)</li>
            <li><b>D / Sağ Ok:</b> Sağa Dön (100)</li>
            <li><b>Space (Boşluk):</b> Fren / Dur</li>
        </ul>
        <div class="telemetry-box" id="telemetry">Gaz: 0 | Direksiyon: 0</div>
    </div>

<script>
let throttle = 0;
let steering = 0;
let keyState = {};

// Bluetooth REPL Değişkenleri
let bleDevice = null;
let rxCharacteristic = null;
let lastSentThrottle = null;
let lastSentSteering = null;

const statusText = document.getElementById('statusText');
const telemetry = document.getElementById('telemetry');

// SPIKE v3 / MicroPython Uyumlu Servis UUID'leri
const NORDIC_UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const LWP3_SERVICE_UUID        = '00001623-1212-efde-1623-785feabcd123';
const PYBRICKS_SERVICE_UUID    = 'c5f50001-8280-46da-89f4-6d8059d4aeef';

// -----------------------------------------------------------------------------
// 1. BLUETOOTH BAĞLANTISI (Çoklu Servis Desteği ile Güncellendi)
// -----------------------------------------------------------------------------
document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
        statusText.innerText = "Durum: Cihaz aranıyor...";
        statusText.style.color = "#ffcc00";

        // Tıklama anında doğrudan diyalog penceresini açar
        bleDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
                NORDIC_UART_SERVICE_UUID,
                LWP3_SERVICE_UUID,
                PYBRICKS_SERVICE_UUID
            ]
        });

        statusText.innerText = "Durum: Hub'a bağlanılıyor...";
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bleDevice.gatt.connect();

        // Hub üzerinde aktif olan servisi sırayla tespit et
        let service;
        try {
            service = await server.getPrimaryService(NORDIC_UART_SERVICE_UUID);
        } catch (e1) {
            try {
                service = await server.getPrimaryService(PYBRICKS_SERVICE_UUID);
            } catch (e2) {
                service = await server.getPrimaryService(LWP3_SERVICE_UUID);
            }
        }

        // Seçilen servisin yazılabilir komut karakteristiğini otomatik bul
        const characteristics = await service.getCharacteristics();
        rxCharacteristic = characteristics.find(c => c.properties.writeWithoutResponse || c.properties.write);

        if (!rxCharacteristic) {
            throw new Error("Yazılabilir Bluetooth komut kanalı bulunamadı!");
        }

        statusText.innerText = "Durum: Bağlandı! (Hazır)";
        statusText.style.color = "#00ffcc";

    } catch (error) {
        console.error("Bluetooth Bağlantı Hatası:", error);
        statusText.innerText = "Durum: Bağlanamadı (" + error.message + ")";
        statusText.style.color = "#ff4444";
    }
});

function onDisconnected() {
    rxCharacteristic = null;
    statusText.innerText = "Durum: Bağlantı Kesildi!";
    statusText.style.color = "#ff4444";
}

// -----------------------------------------------------------------------------
// 2. KLAVYE DİNLERİLERİ (KeyDown / KeyUp)
// -----------------------------------------------------------------------------
window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    keyState[e.code] = true;
    updateControlValues();
});

window.addEventListener('keyup', (e) => {
    keyState[e.code] = false;
    updateControlValues();
});

// -----------------------------------------------------------------------------
// 3. EKRAN BUTONLARI DİNLERİLERİ (Fare & Dokunmatik Ekran)
// -----------------------------------------------------------------------------
const buttonMap = {
    'btnW': 'KeyW',
    'btnS': 'KeyS',
    'btnA': 'KeyA',
    'btnD': 'KeyD',
    'btnSpace': 'Space'
};

Object.keys(buttonMap).forEach(btnId => {
    const el = document.getElementById(btnId);
    const code = buttonMap[btnId];

    const pressHandler = (e) => {
        e.preventDefault();
        keyState[code] = true;
        el.classList.add('active');
        updateControlValues();
    };

    const releaseHandler = (e) => {
        e.preventDefault();
        keyState[code] = false;
        el.classList.remove('active');
        updateControlValues();
    };

    el.addEventListener('mousedown', pressHandler);
    el.addEventListener('mouseup', releaseHandler);
    el.addEventListener('mouseleave', releaseHandler);

    el.addEventListener('touchstart', pressHandler);
    el.addEventListener('touchend', releaseHandler);
});

// -----------------------------------------------------------------------------
// 4. KONTROL DEĞİŞKENLERİNİ HESAPLAMA VE FİLTRELEME
// -----------------------------------------------------------------------------
function updateControlValues() {
    // Gaz Hesaplama
    if (keyState['KeyW'] || keyState['ArrowUp']) {
        throttle = 80;
    } else if (keyState['KeyS'] || keyState['ArrowDown']) {
        throttle = -60;
    } else {
        throttle = 0;
    }

    // Direksiyon Hesaplama
    if (keyState['KeyA'] || keyState['ArrowLeft']) {
        steering = -100;
    } else if (keyState['KeyD'] || keyState['ArrowRight']) {
        steering = 100;
    } else {
        steering = 0;
    }

    // Acil Fren (Space)
    if (keyState['Space']) {
        throttle = 0;
        steering = 0;
    }

    telemetry.innerText = `Gaz: ${throttle} | Direksiyon: ${steering}`;

    // Sadece Değer Değiştiğinde Gönder (Bluetooth paket yığılmasını engeller)
    if (throttle !== lastSentThrottle || steering !== lastSentSteering) {
        lastSentThrottle = throttle;
        lastSentSteering = steering;
        sendDataToSpike(throttle, steering);
    }
}

// -----------------------------------------------------------------------------
// 5. SPIKE HUB'A CANLI REPL KOMUTU GÖNDERME
// -----------------------------------------------------------------------------
async function sendDataToSpike(t, s) {
    if (!rxCharacteristic) return;

    try {
        // SPIKE Hub'da çalışan Python script'indeki drive_car(throttle, steering) tetiklenir
        const command = `drive_car(${t},${s})\r`;
        const encoder = new TextEncoder();
        const data = encoder.encode(command);

        if (rxCharacteristic.properties.writeWithoutResponse) {
            await rxCharacteristic.writeValueWithoutResponse(data);
        } else {
            await rxCharacteristic.writeValue(data);
        }
    } catch (err) {
        console.error("Veri gönderim hatası:", err);
    }
}
</script>
</body>
</html>
